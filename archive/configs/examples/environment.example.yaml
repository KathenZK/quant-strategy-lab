project:
  name: quant-strategy-lab
  timezone: UTC

storage:
  shared: true

exchanges:
  - name: binance
    enabled: true
    market_types: [spot, perp]
    quote_assets: [USDT, USDC]
  - name: okx
    enabled: true
    market_types: [spot, perp]
    quote_assets: [USDT, USDC]

research:
  bar_frequencies: [1h, 4h, 1d]
  benchmark_symbols: [BTC/USDT, ETH/USDT]
  universe_filters:
    min_avg_dollar_volume: 1000000
    exclude_stablecoins: true

