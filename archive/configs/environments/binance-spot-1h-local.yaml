project:
  name: quant-strategy-lab-binance-spot-1h-local
  timezone: UTC

storage:
  shared: false
  root_dir: data
  raw_dir: data/raw
  normalized_dir: data/normalized
  features_dir: data/features
  reports_dir: reports

exchanges:
  - name: binance
    enabled: true
    market_types: [spot]
    quote_assets: [USDT]

research:
  bar_frequencies: [1h]
  benchmark_symbols: [BTC/USDT]
  universe_filters:
    min_avg_dollar_volume: 5000000
    exclude_stablecoins: true

