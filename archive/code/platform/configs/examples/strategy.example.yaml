strategy:
  name: momentum_rotation_perp_demo
  strategy_type: momentum_rotation
  exchange: binance
  market_type: perp
  strategy_params:
    symbols:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
      - SOL/USDT:USDT
    max_long_positions: 2
    max_short_positions: 2
    breakout_floor: -0.01
    min_volume_surge: -0.5
    max_liquidation_spike_zscore: 2.5
    max_liquidation_notional_ratio: 0.03
    liquidation_weight_scale: 0.25
    stop_on_event_cooldown: true

execution:
  fee_bps: 5.0
  slippage_bps: 2.0
  starting_cash: 100000.0

risk:
  max_abs_weight: 0.2
  max_gross_leverage: 1.0
  max_net_exposure: 1.0
  min_dollar_volume: 1000000.0

refresh:
  enabled: true
  incremental: true
  include_derivatives: true
  timeframe: 1h
  limit: 500
  overlap_bars: 50

workflow:
  run_factor_report: true
  run_backtest: true
  run_paper_trade: true

schedule:
  enabled: false
  sleep_seconds: 0
  max_runs: 1
