project:
  name: quant-strategy-lab-mvp-baseline
  timezone: UTC

storage:
  root_dir: data/mvp-baseline
  raw_dir: data/mvp-baseline/raw
  normalized_dir: data/mvp-baseline/normalized
  features_dir: data/mvp-baseline/features
  reports_dir: reports/mvp-baseline

exchanges:
  - name: binance
    enabled: true
    market_types: [perp]
    quote_assets: [USDT]

research:
  bar_frequencies: [1h, 4h, 1d]
  benchmark_symbols: [BTC/USDT:USDT, ETH/USDT:USDT]
  universe_filters:
    min_avg_dollar_volume: 1000000
    exclude_stablecoins: true
