project:
  name: quant-strategy-lab-binance-recent1y
  timezone: UTC

storage:
  root_dir: data/binance-recent1y
  raw_dir: data/binance-recent1y/raw
  normalized_dir: data/binance-recent1y/normalized
  features_dir: data/binance-recent1y/features
  reports_dir: reports/binance-recent1y

exchanges:
  - name: binance
    enabled: true
    market_types: [perp]
    quote_assets: [USDT]

research:
  bar_frequencies: [1h, 4h, 1d]
  benchmark_symbols: [BTC/USDT:USDT, ETH/USDT:USDT]
  universe_filters:
    min_avg_dollar_volume: 1000000
    exclude_stablecoins: true
