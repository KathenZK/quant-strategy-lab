project:
  name: quant-strategy-lab-binance-recent1y-daily
  timezone: UTC

storage:
  root_dir: data/binance-recent1y-daily
  raw_dir: data/binance-recent1y-daily/raw
  normalized_dir: data/binance-recent1y-daily/normalized
  features_dir: data/binance-recent1y-daily/features
  reports_dir: reports/binance-recent1y-daily

exchanges:
  - name: binance
    enabled: true
    market_types: [perp]
    quote_assets: [USDT]

research:
  bar_frequencies: [1d]
  benchmark_symbols: [BTC/USDT:USDT, ETH/USDT:USDT]
  universe_filters:
    min_avg_dollar_volume: 0
    exclude_stablecoins: true
