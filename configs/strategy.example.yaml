strategy:
  name: momentum_perp_demo
  factor: ret_24
  exchange: binance
  market_type: perp
  symbols:
    - BTC/USDT:USDT
    - ETH/USDT:USDT
    - SOL/USDT:USDT
  benchmark_symbol: BTC/USDT:USDT

execution:
  fee_bps: 5.0
  slippage_bps: 2.0
  starting_cash: 100000.0

risk:
  max_abs_weight: 0.2
  max_gross_leverage: 1.0
  max_net_exposure: 1.0
  min_dollar_volume: 1000000.0

refresh:
  enabled: true
  incremental: true
  include_derivatives: true
  timeframe: 1h
  limit: 500
  overlap_bars: 50

workflow:
  run_factor_report: true
  run_backtest: true
  run_paper_trade: true

schedule:
  enabled: false
  sleep_seconds: 0
  max_runs: 1
