strategy:
  name: momentum_rotation_binance_recent3m
  strategy_type: momentum_rotation
  exchange: binance
  market_type: perp
  symbols:
    - BTC/USDT:USDT
    - ETH/USDT:USDT
    - SOL/USDT:USDT
  strategy_params:
    primary_momentum_factor: ret_24
    short_momentum_factor: ret_4
    breakout_factor: breakout_20
    rsi_factor: rsi_14
    volume_factor: volume_surge_20
    min_momentum: 0.005
    breakout_floor: -0.01
    min_volume_surge: -0.5
    min_long_rsi: 50.0
    max_long_rsi: 85.0
    min_short_rsi: 15.0
    max_short_rsi: 50.0
    primary_momentum_weight: 1.0
    short_momentum_weight: 0.5
    breakout_weight: 0.8
    rsi_weight: 0.5
    volume_weight: 0.3
    max_long_positions: 2
    max_short_positions: 2
    long_allocation: 0.5
    short_allocation: 0.5
    market_neutral: true
    max_liquidation_spike_zscore: 2.5
    max_liquidation_notional_ratio: 0.03
    liquidation_weight_scale: 0.25
    stop_on_event_cooldown: true

execution:
  fee_bps: 5.0
  slippage_bps: 2.0
  starting_cash: 100000.0
  max_abs_weight: 0.2
  max_gross_leverage: 1.0
  max_net_exposure: 1.0
  min_dollar_volume: 1000000.0
  max_funding_rate_abs: 2.5

risk:
  max_abs_weight: 0.2
  max_gross_leverage: 1.0
  max_net_exposure: 1.0
  min_dollar_volume: 1000000.0
  max_funding_rate_abs: 2.5
  max_drawdown: 0.20

refresh:
  enabled: false
  incremental: false
  include_derivatives: true
  timeframe: 1h
  limit: 500
  overlap_bars: 0

workflow:
  run_factor_report: false
  run_backtest: true
  run_paper_trade: false

schedule:
  enabled: false
  sleep_seconds: 0
  max_runs: 1
