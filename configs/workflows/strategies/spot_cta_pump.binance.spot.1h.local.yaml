    rsi_factor: rsi_14
    min_primary_momentum: 0.06
    min_confirmation_momentum: 0.02
    min_acceleration_momentum: 0.0
    min_volume_surge: 0.5
    min_rsi: 55.0
    max_rsi: 96.0
    max_positions: 5
    long_allocation: 0.60
    stop_loss_pct: 0.08
    trailing_stop_pct: 0.28
