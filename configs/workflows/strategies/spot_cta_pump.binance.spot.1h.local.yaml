  exchange: binance
  market_type: spot
  benchmark_symbol: BTC/USDT
  symbols:
    - BTC/USDT
    - ETH/USDT
    - BNB/USDT
    - SOL/USDT
    - XRP/USDT
    - DOGE/USDT
    - ADA/USDT
    - TRX/USDT
    - AVAX/USDT
    - LINK/USDT
    - LTC/USDT
  strategy_params:
    breakout_factor: donchian_breakout_10
    primary_momentum_factor: ret_12
    confirmation_momentum_factor: ret_4
    acceleration_momentum_factor: ret_1
