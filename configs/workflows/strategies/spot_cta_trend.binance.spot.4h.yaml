strategy:
  name: spot_cta_trend_binance_spot_4h
  strategy_type: spot_cta_trend
  exchange: binance
  market_type: spot
  benchmark_symbol: BTC/USDT
  symbols:
    - BTC/USDT
    - ETH/USDT
    - BNB/USDT
    - SOL/USDT
    - XRP/USDT
    - DOGE/USDT
    - ADA/USDT
    - AVAX/USDT
    - LINK/USDT
    - LTC/USDT
  strategy_params:
    breakout_factor: donchian_breakout_20
    primary_momentum_factor: ret_72
    confirmation_momentum_factor: ret_24
    trend_factor: ma_distance_120
    volume_factor: volume_surge_20
    rsi_factor: rsi_14
    illiquidity_factor: amihud_illiquidity
    volatility_factor: atr_pct_14
    min_breakout_signal: 1.0
    min_primary_momentum: 0.03
    min_confirmation_momentum: 0.0
    min_trend_distance: 0.0
    min_volume_surge: -0.25
    min_rsi: 50.0
    max_rsi: 86.0
    max_atr_pct: 0.30
    max_positions: 10
    long_allocation: 0.70
    stop_loss_pct: 0.10
    trailing_stop_pct: 0.18
    take_profit_pct:
    max_hold_bars:
    cooldown_bars: 6
    exit_on_signal_loss: true
    exit_signal_threshold: 0.0
    max_rank_hold_positions: 20

universe:
  source: local_binance_spot
  min_avg_dollar_volume: 1000000.0
  min_history_bars: 120
  max_symbols: 0

execution:
  fee_bps: 10.0
  slippage_bps: 20.0
  starting_cash: 100000.0

risk:
  max_abs_weight: 0.08
  max_gross_leverage: 0.70
  max_net_exposure: 0.70
  min_dollar_volume: 1000000.0
  max_drawdown: 0.20

refresh:
  enabled: false
  incremental: false
  include_derivatives: false
  timeframe: 4h
  limit: 1500
  overlap_bars: 0

workflow:
  run_factor_report: false
  run_backtest: true
  run_paper_trade: false

schedule:
  enabled: false
  sleep_seconds: 0
  max_runs: 1
