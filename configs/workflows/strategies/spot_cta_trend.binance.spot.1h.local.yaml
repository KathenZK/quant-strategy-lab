    max_rsi: 82.0
    max_atr_pct: 0.10
    max_positions: 10
    long_allocation: 0.60
    stop_loss_pct: 0.10
    trailing_stop_pct: 0.18
    take_profit_pct: 0.12
    max_hold_bars: 72
    cooldown_bars: 12
    exit_on_signal_loss: false
    exit_signal_threshold: 0.0
    max_rank_hold_positions: 20

universe:
  source: local_binance_spot
  min_avg_dollar_volume: 1000000.0
  min_history_bars: 120
  max_symbols: 0

execution:
  fee_bps: 10.0
  slippage_bps: 30.0
  starting_cash: 100000.0

risk:
  max_abs_weight: 0.08
  max_gross_leverage: 0.60
  max_net_exposure: 0.60
  min_dollar_volume: 1000000.0
  max_drawdown: 0.20

refresh:
  enabled: false
  incremental: false
  include_derivatives: false
  timeframe: 1h
  limit: 1000
  overlap_bars: 0

workflow:
  run_factor_report: false
  run_backtest: true
  run_paper_trade: false

schedule:
  enabled: false
  sleep_seconds: 0
  max_runs: 1
