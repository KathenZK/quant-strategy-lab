strategy:
  name: donchian_breakout_binance_btc_recent1y_daily
  strategy_type: donchian_breakout
  exchange: binance
  market_type: perp
  symbols:
    - BTC/USDT:USDT
  strategy_params:
    breakout_factor: donchian_breakout_14
    trend_factor: ma_distance_120
    long_allocation: 1.0
    short_allocation: 1.0
    exit_on_trend_reversal: true
    stop_loss_pct: 0.08
    trailing_stop_pct: 0.06
    risk_budget_pct: 0.02
    max_pyramids: 2
    pyramid_step_pct: 0.05
    pyramid_unit_scale: 0.5

execution:
  fee_bps: 5.0
  slippage_bps: 2.0
  starting_cash: 100000.0
  max_abs_weight: 1.0
  max_gross_leverage: 1.0
  max_net_exposure: 1.0
  min_dollar_volume: 0.0

risk:
  max_abs_weight: 1.0
  max_gross_leverage: 1.0
  max_net_exposure: 1.0
  min_dollar_volume: 0.0

refresh:
  enabled: false
  incremental: false
  include_derivatives: false
  timeframe: 1d
  limit: 500
  overlap_bars: 0

workflow:
  run_factor_report: false
  run_backtest: true
  run_paper_trade: false

schedule:
  enabled: false
  sleep_seconds: 0
  max_runs: 1
