name: Governance gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install governance test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate active strategy manifest
        run: python3 scripts/governance/validate_manifest.py
      - name: Validate standardized parity reports
        run: python3 scripts/governance/check_parity_report.py
      - name: Validate Lab live specs
        run: python3 scripts/governance/validate_live_specs.py
      - name: Run research document consistency tests
        run: pytest -q tests/test_research_docs_consistency.py
